[package]
name = "zorp-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local pretraining engine and supervisor for Zorp."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tempfile = { workspace = true }
# The workspace tokio plus the two this crate adds: it supervises a Python
# child and reads its lines. `full` was what this asked for, and feature
# unification meant every build of the workspace got all of tokio.
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-stream = { workspace = true }
tracing = "0.1"
rustix = { workspace = true }

[dev-dependencies]
ureq = { workspace = true }
