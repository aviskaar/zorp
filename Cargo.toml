[package]
name = "zorp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The smallest harness of all time."
license.workspace = true

[dependencies]
ureq = { workspace = true }   # do NOT set default-features = false
serde_json = { workspace = true }

[lints]
workspace = true

[workspace]
members = [".", "zorp-agent", "zorp-mcp", "zorp-eval", "zorp-track", "erbga"]

[workspace.package]
edition = "2021"
license = "MIT"
# Floor is set by Option::is_none_or (stable 1.82), used in zorp-agent
# and zorp-eval. Raise deliberately, not by accident.
rust-version = "1.82"

# Shared dependencies. Declared once here so feature lists cannot drift
# apart between crates; members refer to them with `workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Cheap policy for a project that sells itself on minimalism and on not
# lying about results. These are warnings, not hard errors, so they do
# not block work in progress.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Optimize the release binary for size, fitting for "the smallest harness."
# panic stays at the default (unwind): zorp-agent catches subagent panics
# with catch_unwind, and panic = "abort" would silently disable that guard
# in release builds. The unwind tables cost a few KB.
[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization across crates
codegen-units = 1   # better optimization, smaller output
strip = true        # strip symbols

# The size profile is wrong for the analytic research stack: "z" pessimizes
# the DuckDB and Arrow hot paths the research feature exists for, and is the
# most expensive knob in the whole build when applied to zorp-track.
[profile.release.package.zorp-track]
opt-level = 2

# Same reasoning for erbga: it is a compute-bound genetic algorithm whose
# benchmark reproduces published numbers under a time budget, so optimizing
# it for size would be measuring the wrong thing.
[profile.release.package.erbga]
opt-level = 3

# Compile the bundled C database engines optimized even in dev/test builds.
# They compile once, cache well, and unoptimized DuckDB dominates test time.
[profile.dev.package.libduckdb-sys]
opt-level = 2
[profile.dev.package.duckdb]
opt-level = 2
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.rusqlite]
opt-level = 2
