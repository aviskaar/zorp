[package]
name = "zorp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The smallest harness of all time."
license.workspace = true

[dependencies]
ureq = { workspace = true }   # do NOT set default-features = false
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[workspace]
members = [".", "zorp-agent", "zorp-mcp", "zorp-eval", "zorp-track", "zorp-web", "zorp-search", "zorp-skill", "zorp-recall", "zorp-voice", "erbga"]

[workspace.package]
edition = "2021"
license = "MIT"
# One version for the whole product, bumped with each release tag, so
# `--version` names the release you actually installed. These drifted
# apart once already: v0.3.1 shipped a zorp-agent that reported 0.2.1,
# which is the version whose first message times out on a cold model, so
# anyone checking that they had the fix was told they did not. The
# `default-version` job in the Release workflow now fails a release whose
# tag and manifest disagree. erbga is deliberately not on this version;
# it is standalone prior-work and versions on its own terms.
version = "0.3.2"
# The floor is set by the dependency tree, not by the code. `merman`, a
# non-optional dependency of zorp-agent, declares 1.95, and below that
# `globset` and `icu_collections` want 1.88 while `hashbrown` needs Cargo's
# `edition2024` feature (stable in 1.85). The code itself would still build
# on 1.82, which is what this said for a long time while nothing checked it:
# `cargo +1.82 check --workspace --locked` failed on `hashbrown` and every
# CI job used `stable`, so the number drifted thirteen minor versions
# without a single build going red.
#
# The `msrv` job in CI now builds with exactly this toolchain, so raising it
# is a deliberate edit rather than something that happens quietly when a
# dependency does it for us. Note there is no headroom left: 1.95 is current
# stable, so anyone on an older Rust cannot build zorp at all.
rust-version = "1.95"

# Shared dependencies. Declared once here so feature lists cannot drift
# apart between crates; members refer to them with `workspace = true`.
[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
dirs = "6"
rustix = { version = "1", features = ["process"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-stream = "0.3"
futures-core = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Office formats are zip archives of XML. Only stored and deflated entries
# ever appear in one, so every other codec is switched off: aes, bzip2,
# lzma, zstd and xz would all be attack surface for a file format that
# never uses them. Pinned to 4 rather than the 6 already in the lock as a
# build dependency of libduckdb-sys, because 6 needs Rust 1.83 and this
# workspace's floor is 1.82.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"
# A PDF records where each glyph was drawn, not what it said, so reading one
# back means font encodings, ToUnicode CMaps and Type1 tables. That machinery
# is the whole reason this is a dependency and not another hand-rolled reader
# next to `documents.rs`: the cheap version of it is what makes the difference
# between zorp's own paper reading as prose and reading as one unbroken word.
# It is pulled in for a single call. lopdf comes with it, and pdf-extract
# already asks for lopdf with default features off, so lopdf's chrono, jiff,
# rayon and time stay out; the rest of lopdf's tree, AES and friends, is its
# support for encrypted files and lopdf does not put that behind a feature.
# Nineteen crates arrive that the workspace did not have and every one of
# them is MIT or MIT/Apache-2.0.
pdf-extract = "0.12"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Cheap policy for a project that sells itself on minimalism and on not
# lying about results. These are warnings, not hard errors, so they do
# not block work in progress.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Optimize the release binary for size, fitting for "the smallest harness."
# panic stays at the default (unwind): zorp-agent catches subagent panics
# with catch_unwind, and panic = "abort" would silently disable that guard
# in release builds. The unwind tables cost a few KB.
[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization across crates
codegen-units = 1   # better optimization, smaller output
strip = true        # strip symbols

# The size profile is wrong for the analytic research stack: "z" pessimizes
# the DuckDB and Arrow hot paths the research feature exists for, and is the
# most expensive knob in the whole build when applied to zorp-track.
[profile.release.package.zorp-track]
opt-level = 2

# Same reasoning for erbga: it is a compute-bound genetic algorithm whose
# benchmark reproduces published numbers under a time budget, so optimizing
# it for size would be measuring the wrong thing.
[profile.release.package.erbga]
opt-level = 3

# Compile the bundled C database engines optimized even in dev/test builds.
# They compile once, cache well, and unoptimized DuckDB dominates test time.
[profile.dev.package.libduckdb-sys]
opt-level = 2
[profile.dev.package.duckdb]
opt-level = 2
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.rusqlite]
opt-level = 2
