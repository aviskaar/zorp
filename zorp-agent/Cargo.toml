[package]
name = "zorp-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Research agent built on the zorp core."
license.workspace = true
default-run = "zorp-agent"

[lints]
workspace = true

[dependencies]
crossterm = "0.27"
termimad = "0.35"
merman = { version = "0.7", features = ["ascii"] }
zorp = { path = ".." }
serde_json = { workspace = true }
ignore = "0.4"
regex = "1"
ctrlc = "3"
libc = "0.2"
rusqlite = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zorp-mcp   = { path = "../zorp-mcp", optional = true }
zorp-track = { path = "../zorp-track", optional = true }
zorp-recall = { path = "../zorp-recall", optional = true }
zorp-search = { path = "../zorp-search", optional = true }
zorp-skill = { path = "../zorp-skill" }
arboard    = { version = "3", optional = true }

# Optional OpenTelemetry and Tracing Dependencies
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.14", features = ["http-proto", "reqwest-client"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = []
otel = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio"
]
mcp      = ["dep:zorp-mcp"]
# The only built-in that sends anything over the network. Deliberately not
# part of `research`: running investigate locally should not acquire an
# egress path by side effect.
search   = ["dep:zorp-search"]
research = ["dep:zorp-track", "mcp"]
# Search your own conversations, by meaning. Non-default and matching the
# feature of the same name on `zorp-web`: without it there is no
# `zorp-recall` anywhere in this crate's dependency tree.
recall   = ["dep:zorp-recall"]
# Reading that index into a live turn, which is a different risk from
# reading it into a sidebar: one puts old text in front of a person, this
# one puts it in front of a model. Turns on `recall`, the way `zorp-web`'s
# feature of the same name does.
memory   = ["recall"]
# Opt-in vector store for validate's cited sources. Deliberately not
# part of `research`: it drags in LanceDB's arrow stack at build time.
library  = ["research", "zorp-track/library"]
clipboard = ["dep:arboard"]
# The review loop over free models: one model works, others test it, the
# findings go back. Off by default. It is a harness experiment and a plain
# run should not carry it.
ensemble = []

[[bin]]
name = "stub_search_mcp_server"
path = "tests/fixtures/stub_search_mcp_server.rs"
required-features = ["research"]

[[test]]
name = "ensemble_cli"
required-features = ["ensemble"]

[dev-dependencies]
tempfile = { workspace = true }
# The scripted provider these tests run against, shared with zorp-eval's
# deterministic harness suite so the two cannot drift apart.
zorp-stub = { path = "../zorp-stub" }
