[package]
name = "zorp-agent"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "Coding agent built on the zorp core."
license.workspace = true
default-run = "zorp-agent"

[lints]
workspace = true

[dependencies]
crossterm = "0.27"
termimad = "0.35"
merman = { version = "0.7", features = ["ascii"] }
zorp = { path = ".." }
serde_json = { workspace = true }
ignore = "0.4"
regex = "1"
ctrlc = "3"
libc = "0.2"
rusqlite = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zorp-mcp   = { path = "../zorp-mcp", optional = true }
zorp-track = { path = "../zorp-track", optional = true }
arboard    = { version = "3", optional = true }

# Optional OpenTelemetry and Tracing Dependencies
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.14", features = ["http-proto", "reqwest-client"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = []
otel = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio"
]
mcp      = ["dep:zorp-mcp"]
research = ["dep:zorp-track", "mcp"]
# Opt-in vector store for validate's cited sources. Deliberately not
# part of `research`: it drags in LanceDB's arrow stack at build time.
library  = ["research", "zorp-track/library"]
clipboard = ["dep:arboard"]

[[bin]]
name = "stub_search_mcp_server"
path = "tests/fixtures/stub_search_mcp_server.rs"
required-features = ["research"]

[dev-dependencies]
tempfile = { workspace = true }
