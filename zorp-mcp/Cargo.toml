[package]
name        = "zorp-mcp"
version     = "0.1.0"
edition     = "2021"
description = "MCP client library for zorp-agent."
license     = "MIT"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
ureq       = { version = "2", features = ["json"] }
sha2       = "0.10"
zorp     = { path = ".." }

[dev-dependencies]
tempfile = "3"
