[package]
name        = "zorp-track"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Research-track storage and checkpoints for zorp-agent."
license.workspace = true

[lints]
workspace = true

[dependencies]
# The search layer's backend for graphs too large to answer exactly.
# See docs/DECISIONS.md, 2026-08-19, which is the entry that permits this
# and partly reverses 2026-08-15. erbga is a standalone implementation of
# published prior work and has no dependencies of its own, so this adds
# one path crate to the tree and nothing else.
erbga   = { path = "../erbga" }
duckdb  = { version = "1", features = ["bundled"] }
lancedb = { version = "0.33", optional = true }
tokio   = { version = "1", features = ["rt"], optional = true }
sha2    = { workspace = true }
chrono  = { version = "0.4", default-features = false, features = ["clock"] }
serde   = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# The LanceDB-backed Library (vector store for multimodal sources).
# Off by default: it pulls in the arrow stack (hundreds of crates), and
# nothing reads from it yet; citations live in DuckDB.
library = ["dep:lancedb", "dep:tokio"]

[dev-dependencies]
tempfile = { workspace = true }
