[package]
name        = "zorp-track"
version     = "0.1.0"
edition     = "2021"
description = "Research-track storage and checkpoints for zorp-agent."
license     = "MIT"

[dependencies]
duckdb  = { version = "1", features = ["bundled"] }
lancedb = "0.33"
tokio   = { version = "1", features = ["rt", "rt-multi-thread"] }
sha2    = "0.10"
chrono  = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
