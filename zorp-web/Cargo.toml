[package]
name = "zorp-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local web UI server for the zorp agent."
license.workspace = true

[lints]
workspace = true

[features]
default = []
# The `web_search` built-in, and with it the only path out of this machine
# that the browser agent has. Opt-in for the same reason it is opt-in on
# `zorp-agent`: starting a local web UI should not acquire an egress path by
# side effect. `GET /api/capabilities` reports whether it is actually there,
# so the page never has to guess.
search = ["zorp-agent/search"]

[dependencies]
zorp-agent = { path = "../zorp-agent" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
async-stream = { workspace = true }
futures-core = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
pdf-extract = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
