[package]
name = "zorp-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local web UI server for the zorp agent."
license.workspace = true

[lints]
workspace = true

[features]
default = []
# The `web_search` built-in, and with it the only path out of this machine
# that the browser agent has. Opt-in for the same reason it is opt-in on
# `zorp-agent`: starting a local web UI should not acquire an egress path by
# side effect. `GET /api/capabilities` reports whether it is actually there,
# so the page never has to guess.
search = ["zorp-agent/search"]
# Semantic search over the conversations already in the store. Off by
# default for the same reason `search` is, and the contrast is the point:
# `search` opts into an egress path, this one opts into a capability that
# refuses to have one. It also decides whether the search box appears,
# which the operator of the server should turn on rather than discover.
recall = ["dep:zorp-recall", "dep:sha2"]
# Zorp mode: running one pre-registered `investigate` attempt from the
# browser, and reading back what it recorded.
#
# Deliberately not a default. It pulls in zorp-track and DuckDB, which is
# the most expensive thing in this workspace to build, and the ordinary
# chat server has no use for it. The routes exist either way and answer
# 501 without it, so a browser gets told why the button is off instead of
# a 404 it cannot explain.
research = ["dep:zorp-track", "zorp-agent/research"]
# Recalling those conversations into a live turn, rather than only into the
# sidebar. Built on `recall` because it is the same index read a second way,
# and separate from it because they are different risks: `recall` puts old
# text in front of a person, this puts it in front of a model. Off by
# default, and off again per turn unless the person sending it ticks the
# box.
memory = ["recall"]
# Browser voice transcription through a local Qwen3-ASR runtime. The route
# shape exists without this feature and explains that it is off.
voice = ["dep:zorp-voice"]

[dependencies]
zorp-agent = { path = "../zorp-agent" }
zorp-recall = { path = "../zorp-recall", optional = true }
zorp-track = { path = "../zorp-track", optional = true }
zorp-voice = { path = "../zorp-voice", optional = true }
sha2 = { workspace = true, optional = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
async-stream = { workspace = true }
futures-core = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
pdf-extract = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The recall tests seed and then edit a scratch session store directly, to
# stand in for a conversation the user deleted.
rusqlite = { workspace = true }
