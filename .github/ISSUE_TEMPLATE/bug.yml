name: Bug report
description: Something in zorp does not work the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A question about setup or configuration goes to [Q&A](https://github.com/aviskaar/zorp/discussions/categories/q-a) instead.
        `zorp-agent doctor` prints no secret by design, so its output is safe to paste. Never paste an API key.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zorp-agent --version`, or the commit sha for a source build.
      placeholder: "zorp-agent 0.8.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where the bug appeared.
      options:
        - Terminal (zorp-agent)
        - Browser (zorp-web)
        - Mac app
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: The model provider and model id in use.
      placeholder: "Ollama, qwen2.5:7b"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: zorp-agent doctor output
      description: Paste the full output of `zorp-agent doctor`.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `zorp-agent ...`
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Error messages or other output. Remove anything private first.
      render: text
