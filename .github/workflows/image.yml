name: Image

# Publishes a container image so zorp can be tried with no install at all:
#   docker run --rm -v "$PWD":/work ghcr.io/aviskaar/zorp "<task>"
#
# Runs after Release, because the Dockerfile installs the published release
# artifact rather than rebuilding the workspace. Running it on the tag push
# directly would race the release that produces the binaries it needs.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to package, for example v0.2.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Never package a release that did not build, and never treat a
    # rehearsal as one.
    #
    # Release can be run manually to build all four targets without
    # cutting a tag, which is how you check that pipeline before relying
    # on it. Every such run finished "success" and woke this workflow,
    # which then tried to package `main` and died on "not a release tag".
    # A red run on main for a rehearsal that did exactly what it should
    # trains people to ignore the badge.
    #
    # head_branch is the tag name when Release ran from a tag push, and
    # the branch name otherwise, so this skips the job rather than
    # failing it.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the version to package
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            # The triggering Release run was a tag push, so its head_branch
            # is the tag name.
            version="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$version" in
            v*) ;;
            *) echo "not a release tag: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters here. A large share of cheap cloud instances and
          # every Apple Silicon machine is arm64, and emulating amd64 to run
          # a CLI is a poor first impression.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/aviskaar/zorp:${{ steps.v.outputs.version }}
            ghcr.io/aviskaar/zorp:latest

      - name: Smoke test the published image
        # An image that cannot print its own version is worse than no image.
        run: |
          docker run --rm ghcr.io/aviskaar/zorp:${{ steps.v.outputs.version }} --version

      - name: Anonymous pull (the image should be public)
        # #307: check the image is pullable with no credentials, which is the
        # whole promise of "try zorp with no install". The step above ran
        # while this job was still logged in to ghcr.io, so it could pass on a
        # private image. Log out, drop the local copy, and pull fresh as an
        # anonymous client.
        #
        # A freshly created ghcr package is private by default, and making it
        # public is a one-time maintainer settings action this workflow cannot
        # perform. So a failure here is surfaced as a loud, actionable warning
        # rather than failing the release's Image job: the push and the
        # authenticated smoke already succeeded, and blocking on a settings
        # change nobody can make from CI would just train people to ignore a
        # red badge. The warning names exactly what to do.
        run: |
          set -u
          img="ghcr.io/aviskaar/zorp:${{ steps.v.outputs.version }}"
          docker logout ghcr.io || true
          docker image rm "$img" >/dev/null 2>&1 || true
          if docker pull "$img" && docker run --rm "$img" --version; then
            echo "anonymous pull OK: the image is public"
          else
            echo "::warning title=Image not anonymously pullable::Could not pull $img without credentials. Most likely the ghcr package is private; it can also be a transient registry or network error. If it persists, a maintainer should confirm the package is public under its settings (Packages -> zorp -> Package settings -> Change visibility). Until it pulls anonymously, 'docker run ghcr.io/aviskaar/zorp' needs a login."
          fi
