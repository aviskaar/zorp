name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # zorp-track pulls in duckdb (bundled — compiles DuckDB's C++ amalgamation
      # from source) and lancedb (Arrow + DataFusion transitively). That single
      # crate dominates cold-build time on shared runners. It's excluded here so
      # CI stays fast; the research feature (which depends on zorp-track) is
      # covered by `cargo test -p zorp-agent --features research`, required
      # locally before considering research-feature changes done (see CLAUDE.md).
      - name: Test workspace (excluding zorp-track)
        run: cargo test --workspace --exclude zorp-track
