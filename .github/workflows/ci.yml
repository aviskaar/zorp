name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-workspace run so zorp-track and the research feature
    # cannot rot unnoticed between research-touching pull requests.
    - cron: "17 6 * * *"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is a first-class target: the agent uses crossterm, libc, and
        # OwnedFd, and install.sh targets macOS shells.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # zorp-track pulls in duckdb (bundled: compiles DuckDB's C++
      # amalgamation from source), which dominates cold-build time on shared
      # runners. It is excluded here so the per-PR path stays fast; the
      # research job below covers it.
      - name: Test workspace (excluding zorp-track)
        run: cargo test --workspace --exclude zorp-track --locked

  research:
    # Full build of zorp-track and the research-feature surface of
    # zorp-agent. Runs nightly, and on pull requests that touch the
    # research stack.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `shared-key` is load bearing, do not remove it. By default
      # rust-cache puts the job name in the cache key, which would make
      # this job's cache and `research-pr`'s two different entries. A pull
      # request can only restore caches from its own ref and from main, so
      # `research-pr` would look on main for a key only it ever writes,
      # miss every time, and rebuild DuckDB from source for 35 minutes.
      # This job is the one that runs on main, so it is the one that fills
      # the shared entry.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: research-stack

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test zorp-track
        run: cargo test -p zorp-track --locked

      - name: Test zorp-agent (research feature)
        run: cargo test -p zorp-agent --features research --locked

  research-pr:
    # Same coverage for pull requests, gated on paths so unrelated PRs
    # stay cheap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect research-stack changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            research:
              - 'zorp-track/**'
              - 'zorp-agent/src/validate/**'
              - 'zorp-agent/src/investigate/**'
              - 'zorp-agent/src/co_write/**'
              - 'zorp-agent/src/deliver/**'
              - 'zorp-agent/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Install Rust
        if: steps.filter.outputs.research == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Restore the entry the `research` job filled on main, and never
      # write one. See the note on that job for why the key is shared. A
      # pull request's own cache is visible only to that pull request, so
      # saving here bought nothing except 3.2 GB of the repository's 10 GB
      # cache budget, evicting the main entry every other pull request
      # depends on.
      - name: Cache cargo
        if: steps.filter.outputs.research == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: research-stack
          # Quoted: this is a string input, and an unquoted YAML boolean
          # here is the kind of thing that reads as working and does not.
          save-if: "false"

      - name: Install protoc
        if: steps.filter.outputs.research == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test zorp-track
        if: steps.filter.outputs.research == 'true'
        run: cargo test -p zorp-track --locked

      - name: Test zorp-agent (research feature)
        if: steps.filter.outputs.research == 'true'
        run: cargo test -p zorp-agent --features research --locked
