name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-workspace run so zorp-track and the research feature
    # cannot rot unnoticed between research-touching pull requests.
    - cron: "17 6 * * *"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is a first-class target: the agent uses crossterm, libc, and
        # OwnedFd, and install.sh targets macOS shells.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # zorp-track pulls in duckdb (bundled: compiles DuckDB's C++
      # amalgamation from source), which dominates cold-build time on shared
      # runners. It is excluded here so the per-PR path stays fast; the
      # research job below covers it.
      - name: Test workspace (excluding zorp-track)
        run: cargo test --workspace --exclude zorp-track --locked

  msrv:
    # `rust-version` in the root manifest is a promise, and until this job
    # existed nothing checked it. Every other job here installs `stable`, so
    # the declared floor sat at 1.82 while the dependency tree had walked to
    # 1.95: `cargo +1.82 check --workspace --locked` failed on `hashbrown`
    # wanting Cargo's `edition2024` feature, and no build ever went red.
    #
    # This installs exactly the declared version and compiles against it, so
    # a dependency that raises the floor fails here instead of failing on a
    # user's machine. It reads the version out of the manifest rather than
    # hardcoding it, so the two cannot disagree.
    #
    # `check`, not `test`: this asks whether the workspace compiles on the
    # oldest supported toolchain, and running the suite a second time buys
    # nothing the other jobs do not already cover. zorp-track is excluded
    # for the same reason as the jobs above, it builds DuckDB from source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          set -eu
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "no rust-version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --exclude zorp-track --all-targets --locked

  clippy:
    # Clippy had never run here. Eleven warnings had accumulated by the time
    # anyone looked, including dead test scaffolding and a lock held across
    # an await. Four choices, made on purpose:
    #
    # 1. One runner, not the two-OS matrix. Every lint clippy has caught in
    #    this workspace so far is platform independent, so a second leg
    #    would double the cost to catch close to nothing. Platform-specific
    #    code still gets compiled by the macOS test leg above.
    # 2. `-D warnings`. A lint that only prints is a lint nobody reads, and
    #    that is exactly how eleven of them piled up. The existing warnings
    #    are cleared in the same change that adds this, so the gate starts
    #    from zero rather than from a wall of red.
    # 3. `--all-targets`, so tests are linted too. Most of the warnings this
    #    found were in test code. Linting the library alone would have
    #    gated the easy half.
    # 4. Same exclusion as the test job: zorp-track builds DuckDB from
    #    source and would dominate this job the way it dominates that one.
    #    That leaves zorp-track and the research feature unlinted, which is
    #    a known gap, not an oversight. Closing it belongs with the research
    #    jobs and their shared cache, not here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Its own cache entry, keyed on the job name by default. Small, because
      # the DuckDB tree is excluded, so it does not threaten the shared
      # research entry the way a full-workspace entry would.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --exclude zorp-track --all-targets --locked -- -D warnings

  web:
    # The chat UI is TypeScript, and no Rust job compiles a line of it.
    # Without this, a type error or a broken bundle ships: the workspace
    # still goes green, `web/dist` is gitignored so the release tarball
    # carries whatever was last built by hand, and the first person to
    # find out is a user staring at a blank page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run check

      # The markdown renderer turns model output into DOM nodes. If it ever
      # starts producing markup instead of text, that is a cross-site
      # scripting hole in the one place the product shows untrusted content,
      # and a typecheck would not notice. Most of these tests are injection
      # cases for exactly that reason.
      - name: Test the UI
        working-directory: web
        run: npm test

      # Builds exactly what `npm run deploy` uploads, so a broken deploy is
      # a failed check rather than a live site serving a stale bundle.
      - name: Build the deployable site
        working-directory: web
        run: npm run build:site

      - name: Check the bundle came out
        working-directory: web
        run: |
          set -euo pipefail
          # The fonts are here for the same reason as the rest: three
          # separate places copy this directory by name (build:site, the
          # release packaging, the nginx image) and a font left out of one
          # of them does not fail, it just silently falls back to the system
          # sans. Assert on it so a dropped copy is a red check instead.
          for f in dist-site/index.html dist-site/styles.css dist-site/dist/main.js \
                   dist-site/fonts/poppins-latin-300-normal.woff2 \
                   dist-site/fonts/poppins-latin-500-normal.woff2; do
            [ -s "$f" ] || { echo "missing or empty: $f" >&2; exit 1; }
          done
          # Every font the stylesheet asks for must actually be shipped.
          while read -r want; do
            [ -s "dist-site/$want" ] || { echo "styles.css wants $want, not in the site" >&2; exit 1; }
          done < <(grep -o 'fonts/[A-Za-z0-9._-]*\.woff2' styles.css | sort -u)

  research:
    # Full build of zorp-track and the research-feature surface of
    # zorp-agent. Runs nightly, and on pull requests that touch the
    # research stack.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # A cap, because the default is six hours. These jobs build DuckDB
    # from source and take about three minutes warm, so anything past
    # this is stuck rather than slow, and a stuck job should say so
    # while someone is still looking at the pull request.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `shared-key` is load bearing, do not remove it. By default
      # rust-cache puts the job name in the cache key, which would make
      # this job's cache and `research-pr`'s two different entries. A pull
      # request can only restore caches from its own ref and from main, so
      # `research-pr` would look on main for a key only it ever writes,
      # miss every time, and rebuild DuckDB from source for 35 minutes.
      # This job is the one that runs on main, so it is the one that fills
      # the shared entry.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: research-stack

      - name: Install protoc
        timeout-minutes: 5
        run: |
          set -eu
          # Retried, because this is a network fetch from Ubuntu's mirrors
          # sitting in the critical path of a job that otherwise does not
          # touch the network. A mirror that accepts the connection and then
          # stalls used to hang here until GitHub's six hour limit killed the
          # job, twice, and a six hour red check reads like a broken test
          # rather than a broken mirror.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y protobuf-compiler; then
              exit 0
            fi
            echo "protoc install attempt $attempt failed, retrying" >&2
            sleep 5
          done
          echo "could not install protoc after three attempts" >&2
          exit 1

      - name: Test zorp-track
        run: cargo test -p zorp-track --locked

      - name: Test zorp-agent (research feature)
        run: cargo test -p zorp-agent --features research --locked

  research-pr:
    # Same coverage for pull requests, gated on paths so unrelated PRs
    # stay cheap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A cap, because the default is six hours. These jobs build DuckDB
    # from source and take about three minutes warm, so anything past
    # this is stuck rather than slow, and a stuck job should say so
    # while someone is still looking at the pull request.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Both PR endpoints must be present locally to diff them.
          fetch-depth: 0

      # Plain git rather than dorny/paths-filter. That action has to be
      # downloaded from codeload at job start, and when codeload answers
      # 429 or 503 the job fails during setup, before running anything.
      # That happened on three separate runs in one morning and failed
      # pull requests which had not touched the research stack at all.
      # The filter is one grep; it does not need a dependency that can be
      # unavailable.
      - name: Detect research-stack changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Three-dot: what this branch changed since it diverged, not
          # whatever else landed on main in the meantime.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          status=$?
          if [ $status -ne 0 ]; then
            # Fail towards running the tests. Skipping them because the
            # diff broke is the one outcome worth avoiding.
            echo "could not diff $BASE...$HEAD; assuming the research stack changed" >&2
            echo "research=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(zorp-track/|zorp-agent/src/(validate|investigate|co_write|critique|deliver)/|zorp-agent/Cargo\.toml$|Cargo\.toml$|Cargo\.lock$)'; then
            echo "research stack touched" >&2
            echo "research=true" >> "$GITHUB_OUTPUT"
          else
            echo "research stack untouched" >&2
            echo "research=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.filter.outputs.research == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Restore the entry the `research` job filled on main, and never
      # write one. See the note on that job for why the key is shared. A
      # pull request's own cache is visible only to that pull request, so
      # saving here bought nothing except 3.2 GB of the repository's 10 GB
      # cache budget, evicting the main entry every other pull request
      # depends on.
      - name: Cache cargo
        if: steps.filter.outputs.research == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: research-stack
          # Quoted: this is a string input, and an unquoted YAML boolean
          # here is the kind of thing that reads as working and does not.
          save-if: "false"

      - name: Install protoc
        if: steps.filter.outputs.research == 'true'
        timeout-minutes: 5
        run: |
          set -eu
          # See the note on the same step in the `research` job above.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y protobuf-compiler; then
              exit 0
            fi
            echo "protoc install attempt $attempt failed, retrying" >&2
            sleep 5
          done
          echo "could not install protoc after three attempts" >&2
          exit 1

      - name: Test zorp-track
        if: steps.filter.outputs.research == 'true'
        run: cargo test -p zorp-track --locked

      - name: Test zorp-agent (research feature)
        if: steps.filter.outputs.research == 'true'
        run: cargo test -p zorp-agent --features research --locked
