name: Release

# Publishes prebuilt binaries so installing zorp does not require a Rust
# toolchain. Until this existed, every user had to `cargo build`, which put
# a compiler between a curious reader and a working binary.
on:
  push:
    tags: ["v*"]
  # Lets a maintainer produce artifacts for a commit without cutting a tag,
  # which is how you check the pipeline itself works before relying on it.
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  default-version:
    # The Dockerfile's `ARG VERSION` default is what a bare `docker build`
    # produces. Nothing else notices when it goes stale, because both the
    # Image workflow and the documented build command pass VERSION
    # explicitly. It sat at v0.2.1 through the whole v0.3.1 release, so
    # anyone who built without the flag got the one release whose first
    # message times out on a cold model.
    #
    # Always runs, rather than being gated on the ref, because a skipped
    # job counts as unmet for anything that `needs` it, which would skip
    # the build on workflow_dispatch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag, workspace version and Dockerfile default must agree
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag push; nothing to check"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          docker_default="$(sed -n 's/^ARG VERSION=\(.*\)$/\1/p' Dockerfile)"
          # The [workspace.package] version, which every product crate
          # inherits. Read after that header so the root [package] block
          # cannot be picked up by mistake.
          cargo_version="v$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p')"
          echo "tag=${tag} cargo=${cargo_version} dockerfile=${docker_default}"
          fail=0
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error file=Cargo.toml::[workspace.package] version is '${cargo_version#v}' but this release is '${tag}'. Bump it, or the published binary reports the wrong version to everyone who checks."
            fail=1
          fi
          if [ "$tag" != "$docker_default" ]; then
            echo "::error file=Dockerfile::ARG VERSION is '${docker_default}' but this release is '${tag}'. Bump it, or a bare docker build ships the old binary."
            fail=1
          fi
          exit $fail

  build:
    needs: default-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target, deliberately. Cross-compiling Rust to
          # Linux from macOS needs a C toolchain and linker wrangling for the
          # crates here (rusqlite bundles SQLite, which compiles C); native
          # runners keep this workflow boring.
          # Pinned to 22.04, not ubuntu-latest. A binary links against the
          # glibc of the machine that built it and will not start on anything
          # older. ubuntu-latest is 24.04 (glibc 2.39), and the first v0.2.1
          # Linux build failed on Ubuntu 22.04 with "GLIBC_2.39 not found".
          # 22.04 gives glibc 2.35, which covers Ubuntu 22.04 LTS, Debian 12
          # and RHEL 9, the distributions most users are actually on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled from the arm64 runner rather than
          # built on macos-13. GitHub is retiring the Intel macOS runners and
          # that job sat unassigned indefinitely, which blocked publish for
          # the three targets that had already built. Xcode ships both
          # architectures' SDKs, so this needs no extra toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Only the two installed binaries. zorp-track bundles DuckDB and
      # zorp-eval is a dev harness; neither ships, and building them here
      # would add tens of minutes per target for nothing.
      - name: Build the UI bundle
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p zorp -p zorp-agent -p zorp-web

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="zorp-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zorp" "dist/$name/"
          cp "target/${{ matrix.target }}/release/zorp-agent" "dist/$name/"
          cp "target/${{ matrix.target }}/release/zorp-web" "dist/$name/"
          cp README.md LICENSE NOTICE.md "dist/$name/"
          # The web UI is static files the server does not embed, so they
          # ship beside the binaries. Without them zorp-web serves an API
          # with nothing to point a browser at.
          mkdir -p "dist/$name/web"
          cp web/index.html web/styles.css "dist/$name/web/"
          cp -r web/dist "dist/$name/web/dist"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # Checksums are the only way a user can tell that what they
          # downloaded is what was built.
          if command -v shasum >/dev/null; then
            shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          else
            sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          fi

      - name: Smoke test the built binary
        # A release that cannot print its own version is worse than no
        # release. Only run where the host can execute what we just built.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: |
          "target/${{ matrix.target }}/release/zorp-agent" --version
          "target/${{ matrix.target }}/release/zorp-agent" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: zorp-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag produces a release. A manual run still builds and uploads
    # artifacts, which is the point of being able to rehearse.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Prebuilt binaries for `zorp`, `zorp-agent` and `zorp-web`, plus the
            static web UI. No Rust toolchain and no Node needed.

            ```bash
            curl -fsSL https://raw.githubusercontent.com/aviskaar/zorp/main/install.sh | bash
            ```

            Or download the archive for your platform below, verify it against
            its `.sha256`, and put the binaries on your `PATH`. The `web/`
            directory beside them is the chat UI; point any static file server
            at it, or use the container image.

            ```bash
            zorp-web          # then open http://127.0.0.1:7777
            ```

            These binaries do not include the research capabilities
            (`validate`, `investigate`, `co-write`, `deliver`), which are
            behind the `research` feature and require building from source.
            See the README.

            **zorp is pre-alpha.** Interfaces change.
