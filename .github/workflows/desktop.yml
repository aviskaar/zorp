name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach DMG to (e.g. v0.5.0)"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish and upload DMG to GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-mac-dmg:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check Release Version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ -n "${{ inputs.tag }}" ]; then
            sh scripts/check-release-version.sh "$tag"
          else
            echo "Not a tag push or explicit release tag; skipping version check"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Check and test zorp-desktop bridge
        run: |
          cargo check --manifest-path zorp-desktop/Cargo.toml
          cargo test --manifest-path zorp-desktop/Cargo.toml

      - name: Build Universal Bridge
        run: |
          bash zorp-desktop/scripts/build-bridge.sh

      - name: Test Native Swift App
        run: |
          cd zorp-desktop/Zorp
          swift test

      - name: Build Universal DMG
        run: |
          bash zorp-desktop/scripts/package-dmg.sh

      - name: Feature manifest
        # #307: the DMG is a build too, and it carries a different feature set
        # from the prebuilt tarballs. Derive that set from the bridge crate's
        # own `default = [...]`, which is what build-bridge.sh compiles (it
        # passes no --features), so the manifest cannot drift from the real
        # build the way a hardcoded list would. Published beside the DMG so a
        # download has a machine-readable answer to which build carries what.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          # A ref name can contain a slash on a workflow_dispatch rehearsal;
          # keep it out of the file path.
          safe_tag="$(printf '%s' "$tag" | tr '/' '-')"
          feats="$(sed -n 's/^default = \[\(.*\)\]$/\1/p' \
            zorp-desktop/bridge/Cargo.toml | tr -d ' "')"
          echo "bridge default features: $feats"
          # Fail loudly rather than ship a manifest claiming [] (which would
          # happen if the default array were ever wrapped onto several lines
          # and this single-line sed stopped matching).
          if [ -z "$feats" ]; then
            echo "could not read [features] default from bridge/Cargo.toml" >&2
            exit 1
          fi
          sh scripts/feature-manifest.sh "$tag" "universal-apple-darwin-dmg" "$feats" \
            > "zorp-desktop/build/zorp-$safe_tag-desktop.features.json"
          cat "zorp-desktop/build/zorp-$safe_tag-desktop.features.json"

      - name: Checksum DMG
        run: |
          cd zorp-desktop/build
          shasum -a 256 *.dmg > Zorp.dmg.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zorp-desktop-mac-dmg
          path: |
            zorp-desktop/build/*.dmg*
            zorp-desktop/build/*.features.json

      - name: Attach to GitHub Release
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          for i in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            echo "Release $tag not found, attempting create (attempt $i)..."
            if gh release create "$tag" --generate-notes; then
              break
            fi
            sleep 5
          done
          safe_tag="$(printf '%s' "$tag" | tr '/' '-')"
          gh release upload "$tag" zorp-desktop/build/*.dmg* \
            "zorp-desktop/build/zorp-$safe_tag-desktop.features.json" --clobber
