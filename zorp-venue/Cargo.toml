[package]
name        = "zorp-venue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Venue profiles, submission conformance checking, and venue-conformant LaTeX for zorp."
license.workspace = true

[lints]
workspace = true

# No dependency on any other workspace member, and nothing here touches the
# network or a model. A conformance check is a pure function of a document
# and a profile, so it stays testable without either.
[dependencies]
serde = { workspace = true }
toml  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
